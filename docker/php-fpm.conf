; PHP-FPM pool (B-33). nginx talks to it over a local socket.
[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Keep the container's environment (APP_KEY, DB_*, …) visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
