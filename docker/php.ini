; Production PHP settings (B-33).
expose_php = Off
memory_limit = 256M
; Report PDFs are up to 20 MB; prescriptions up to 10 MB.
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; The code doesn't change inside a running container.
opcache.validate_timestamps = 0
