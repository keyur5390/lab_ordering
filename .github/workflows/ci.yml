name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend (types, lint, format, build)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run types
            - run: npm run lint
            - run: npm run format:check
            - run: npm run build

    backend:
        name: Backend (${{ matrix.database }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - database: mysql
                      port: 3306
                    - database: pgsql
                      port: 5432

        services:
            mysql:
                image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || '' }}
                env:
                    MYSQL_DATABASE: lab_ordering
                    MYSQL_USER: lab
                    MYSQL_PASSWORD: secret
                    MYSQL_ROOT_PASSWORD: secret
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1"
                    --health-interval=10s --health-timeout=5s --health-retries=5
            postgres:
                image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
                env:
                    POSTGRES_DB: lab_ordering
                    POSTGRES_USER: lab
                    POSTGRES_PASSWORD: secret
                ports: ['5432:5432']
                options: >-
                    --health-cmd="pg_isready -U lab"
                    --health-interval=10s --health-timeout=5s --health-retries=5

        env:
            DB_CONNECTION: ${{ matrix.database }}
            DB_HOST: 127.0.0.1
            DB_PORT: ${{ matrix.port }}
            DB_DATABASE: lab_ordering
            DB_USERNAME: lab
            DB_PASSWORD: secret

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, intl
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - run: composer install --no-interaction --no-progress --prefer-dist

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Code style (Pint)
              run: vendor/bin/pint --test

            - name: Migrate and seed from scratch
              run: php artisan migrate:fresh --seed --force

            - name: Tests
              run: php artisan test

    docker:
        name: Docker image (build and smoke test)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - name: Build
              run: docker build -t lab-ordering:ci .

            - name: Start and check the web container
              run: |
                  docker run -d --name app -p 8080:8080 \
                    -e APP_KEY="base64:$(openssl rand -base64 32)" \
                    -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/ci.sqlite \
                    -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
                    lab-ordering:ci
                  for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/up >/dev/null && break; sleep 2; done
                  curl -fsS http://127.0.0.1:8080/up >/dev/null
                  curl -fsS http://127.0.0.1:8080/robots.txt | grep -q 'Disallow: /admin'
                  curl -fsSI http://127.0.0.1:8080/robots.txt | grep -qi 'x-content-type-options: nosniff'

            - name: Logs on failure
              if: failure()
              run: docker logs app
