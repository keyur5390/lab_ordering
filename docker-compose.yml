# Production stack (B-33): web app, queue worker, scheduler, MySQL and Redis.
# Settings come from .env (copy .env.production.example). See docs/DEPLOY.md.
name: lab-ordering

x-app: &app
  image: ${APP_IMAGE:-lab-ordering:latest}
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    # Reports, prescriptions and other private files. Back this up (docker/backup.sh).
    - storage:/var/www/html/storage/app
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app
    ports:
      - "${APP_PORT:-8080}:8080"

  queue:
    <<: *app
    environment:
      CONTAINER_ROLE: queue

  scheduler:
    <<: *app
    environment:
      CONTAINER_ROLE: scheduler

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  storage:
  mysql:
  redis:
